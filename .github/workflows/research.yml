name: research (temporary)
on:
  push:
    branches: [research-tmp]
    paths: [research/seeds.json]
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: SEEDS="$(cat research/seeds.json)" node research/crawl.mjs
      - run: |
          git add research/out
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git commit -m "research output" && git push
      - name: curl diagnostics for Acme
        if: always()
        run: |
          for u in https://www.acmeuniversal9.com/home http://www.acmeuniversal9.com/home https://www.acmeuniversal.com/; do echo "== $u"; curl -sS -m 20 -A "Mozilla/5.0" -o /dev/null -w "%{http_code} %{redirect_url}\n" "$u" 2>&1 | tail -2; done | tee research/out/curl.txt
          git add research/out/curl.txt && git commit -m "curl diag" && git push || true
