name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Downloads any logo or product photo listed in web/scripts/media-manifest.json
  # that isn't in the repo yet, and commits it to web/public/media. Images already
  # in the repo are never re-downloaded, so the build doesn't depend on other sites.
  media:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download missing images
        run: node web/scripts/fetch-media.mjs
      - name: Commit new images to the repo
        run: |
          git add web/public/media web/src/data/media.json
          if git diff --cached --quiet; then
            echo "No new images."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add downloaded product images to the repo"
            git push
          fi

  build:
    needs: media
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /PrahladTradingCompany
      - name: Keep the previous HTML versions reachable
        run: |
          mkdir -p out/old
          cp ../index.html out/old/index.html
          cp ../index_v2.html out/old/index_v2.html
          cp -r ../assets out/old/assets
          cp -r ../assets out/assets
          touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While Pages is set to "Deploy from a branch", GitHub also publishes the raw
      # repo on every push. Wait for that build to finish so this deployment lands
      # last and the Next.js site is what stays live. (Setting Pages > Source to
      # "GitHub Actions" removes the need for this.)
      - name: Wait for GitHub's own Pages build to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            busy=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=20" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and (.status == "queued" or .status == "in_progress" or .status == "waiting"))] | length')
            if [ "$busy" = "0" ]; then echo "No other Pages build running."; break; fi
            echo "Waiting for $busy GitHub Pages build(s) to finish..."; sleep 15
          done
      # GitHub allows one Pages deployment at a time. When the media job commits
      # images, GitHub's own Pages build starts too; if it's still running, wait
      # and try again instead of failing.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 150
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
